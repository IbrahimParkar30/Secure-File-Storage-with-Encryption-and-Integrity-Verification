<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Files | SecureVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <style>
        body { background: #0f1117; color: #e2e8f0; min-height: 100vh; }
        .card-dark {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }
        .file-row {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color .2s;
        }
        .file-row:hover { border-color: #38bdf8; }
        .btn-dl {
            background: linear-gradient(90deg,#1d4ed8,#0ea5e9);
            border: none; border-radius: 8px;
            font-weight: 600; white-space: nowrap;
        }
        .btn-dl:hover { opacity: .88; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#0f1117; border-bottom:1px solid #1e293b;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-shield-lock-fill me-2" style="color:#38bdf8;"></i>Secure<span style="color:#38bdf8;">Vault</span>
        </a>
        <div class="d-flex gap-3">
            <a class="nav-link text-secondary" href="/"><i class="bi bi-house me-1"></i>Home</a>
            <a class="nav-link text-secondary" href="/verify"><i class="bi bi-patch-check me-1"></i>Verify</a>
            <a class="nav-link text-secondary" href="/chain"><i class="bi bi-link-45deg me-1"></i>Blockchain</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-1"><i class="bi bi-download me-2" style="color:#38bdf8;"></i>Download Files</h3>
            <p class="text-secondary mb-4">
                Select a file to download. Integrity is verified against the blockchain before decryption.
            </p>

            {% if files %}
                {% for f in files %}
                <div class="file-row mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-file-earmark-lock2 fs-3 text-info"></i>
                        <div>
                            <p class="fw-semibold mb-0">{{ f }}</p>
                            <span class="badge bg-success bg-opacity-20 text-success small">Encrypted · AES-256</span>
                        </div>
                    </div>
                    <form action="/download" method="POST">
                        <input type="hidden" name="filename" value="{{ f }}" />
                        <button type="submit" class="btn btn-dl text-white px-4">
                            <i class="bi bi-shield-check me-1"></i>Verify &amp; Download
                        </button>
                    </form>
                </div>
                {% endfor %}
            {% else %}
                <div class="card-dark p-5 text-center">
                    <i class="bi bi-inbox display-4 text-secondary d-block mb-3"></i>
                    <h5 class="text-secondary">No files stored yet.</h5>
                    <a href="/" class="btn btn-outline-info mt-3">
                        <i class="bi bi-cloud-upload me-2"></i>Upload a File
                    </a>
                </div>
            {% endif %}

            <a href="/" class="btn btn-outline-light mt-3">
                <i class="bi bi-arrow-left me-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
